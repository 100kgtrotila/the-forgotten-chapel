<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1019" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Explore an atmospheric gothic chapel courtyard in an interactive 3D scene." />
    <title>The Forgotten Chapel</title>
  </head>
  <body>
    <div id="app"></div>
    <aside class="interface" aria-label="Chapel menu">
      <section class="chapel-menu" id="chapel-menu" aria-labelledby="chapel-title">
        <header class="chapel-menu__header">
          <h1 id="chapel-title">The Forgotten <br /><span>Chapel</span></h1>
        </header>
        <div class="ritual-controls" role="group" aria-label="Ritual controls">
          <button id="activate-ritual" class="ritual-controls__activate" type="button" disabled>Activate ritual</button>
          <div class="ritual-controls__buttons">
            <button id="reset-ritual" type="button" disabled>Reset ritual</button>
            <button id="quality-toggle" type="button" aria-pressed="false">Quality: High</button>
          </div>
          <p id="asset-status" role="status" aria-live="polite"></p>
          <p id="ritual-status" role="status" aria-live="polite">Preparing ritual…</p>
        </div>
      </section>
      <button id="menu-toggle" class="menu-toggle" type="button" aria-controls="chapel-menu" aria-expanded="true">Hide UI</button>
    </aside>
    <p id="status" role="status" aria-live="polite"></p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
